<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Logged Values Charts</title>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
        <style>
            body {
                font-family: 'Inter', sans-serif;
                background-color: #f4f7f6;
                color: #333;
                margin: 0;
                padding: 0;
            }

            h1 {
                font-size: 2rem;
                margin: 20px 0;
                text-align: center;
                color: #333;
            }

            .chart-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
                max-width: 1200px;
                margin: 40px auto;
                padding: 20px;
            }

            .chart-card {
                background-color: white;
                border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
                padding: 20px;
                text-align: center;
            }

            canvas {
                width: 100% !important;
                height: 250px !important;
                border-radius: 8px;
            }

            h2 {
                font-size: 1.25rem;
                color: #333;
                margin-bottom: 10px;
            }

            .chart-card h2 {
                font-size: 1.1rem;
                color: #444;
                margin-bottom: 15px;
            }

            .chart-card .chart {
                position: relative;
            }

            /* Mobile responsiveness */
            @media (max-width: 768px) {
                .chart-container {
                    grid-template-columns: 1fr;
                }

                canvas {
                    height: 200px !important;
                }
            }

            .header {
                text-align: center;
                padding-top: 20px;
            }

            .controls {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                margin-top: 10px;
            }

            .controls label {
                font-size: 1rem;
                color: #555;
            }

            .controls select {
                padding: 6px 14px;
                border-radius: 6px;
                border: 1px solid #ccc;
                font-size: 1rem;
                background: white;
                color: #333;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <div class="header">
            <h1 id="timeTitle">Logged Values in Last 1 Day</h1>
            <div class="controls">
                <label for="timespan">Time Range:</label>
                <select id="timespan">
                    <option value="8">8 Hours</option>
                    <option value="24" selected>1 Day</option>
                    <option value="48">2 Days</option>
                    <option value="72">3 Days</option>
                    <option value="96">4 Days</option>
                    <option value="120">5 Days</option>
                    <option value="144">6 Days</option>
                    <option value="168">1 Week</option>
                </select>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-card">
                <h2>PM02</h2>
                <div class="chart">
                    <canvas id="pm02Chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>RCO2</h2>
                <div class="chart">
                    <canvas id="rco2Chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>ATMP</h2>
                <div class="chart">
                    <canvas id="atmpChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>RHUM</h2>
                <div class="chart">
                    <canvas id="rhumChart"></canvas>
                </div>
            </div>
        </div>

        <script>
            const TIMESPAN_LABELS = {
                8: '8 Hours', 24: '1 Day', 48: '2 Days',
                72: '3 Days', 96: '4 Days', 120: '5 Days',
                144: '6 Days', 168: '1 Week'
            };

            let chartInstances = {};

            function createChart(ctx, timestamps, values, label, annotations) {
                return new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: timestamps,
                        datasets: [{
                            label: label,
                            data: values,
                            borderColor: '#6c757d',
                            fill: false,
                            borderWidth: 2,
                            lineTension: 0.1,
                            pointBackgroundColor: '#6c757d',
                            pointBorderColor: '#495057'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            x: { ticks: { maxRotation: 90, minRotation: 45 } },
                            y: { beginAtZero: false }
                        },
                        plugins: {
                            annotation: { annotations: annotations }
                        }
                    }
                });
            }

            function loadData(hours) {
                fetch(`/data?hours=${hours}`)
                .then(response => response.json())
                .then(data => {
                    if (data.message) return;

                    document.getElementById('timeTitle').textContent =
                        `Logged Values in Last ${TIMESPAN_LABELS[hours]}`;

                    Object.values(chartInstances).forEach(c => c.destroy());
                    chartInstances = {};

                    const pm02Annotations = [
                        { type: 'box', yMin: 0, yMax: 25, backgroundColor: 'rgba(0, 255, 0, 0.2)', borderColor: 'green', borderWidth: 1, label: { content: 'Good (0-25)', enabled: true, position: 'center' } },
                        { type: 'box', yMin: 25, yMax: 50, backgroundColor: 'rgba(255, 255, 0, 0.2)', borderColor: 'yellow', borderWidth: 1, label: { content: 'Fair (25-50)', enabled: true, position: 'center' } },
                        { type: 'box', yMin: 50, yMax: 100, backgroundColor: 'rgba(255, 165, 0, 0.2)', borderColor: 'orange', borderWidth: 1, label: { content: 'Poor (50-100)', enabled: true, position: 'center' } },
                        { type: 'box', yMin: 100, yMax: Math.max(...data.pm02, 140), backgroundColor: 'rgba(255, 0, 0, 0.2)', borderColor: 'red', borderWidth: 1, label: { content: 'Bad (>100)', enabled: true, position: 'center' } }
                    ];

                    const rco2Annotations = [
                        { type: 'box', yMin: Math.min(...data.rco2, 400), yMax: 1000, backgroundColor: 'rgba(0, 255, 0, 0.2)', borderColor: 'green', borderWidth: 1, label: { content: 'Good (200-1000)', enabled: true, position: 'center' } },
                        { type: 'box', yMin: 1000, yMax: 2000, backgroundColor: 'rgba(255, 255, 0, 0.2)', borderColor: 'yellow', borderWidth: 1, label: { content: 'Suboptimal (1000-2000)', enabled: true, position: 'center' } },
                        { type: 'box', yMin: 2000, yMax: Math.max(...data.rco2, 2200), backgroundColor: 'rgba(255, 0, 0, 0.2)', borderColor: 'red', borderWidth: 1, label: { content: 'Bad (>2000)', enabled: true, position: 'center' } }
                    ];

                    const rhumAnnotations = [
                        { type: 'box', yMin: 30, yMax: 60, backgroundColor: 'rgba(0, 255, 0, 0.2)', borderColor: 'green', borderWidth: 1, label: { content: 'Good (30-60)', enabled: true, position: 'center' } }
                    ];

                    chartInstances.pm02 = createChart(document.getElementById('pm02Chart').getContext('2d'), data.timestamps, data.pm02, 'PM02', pm02Annotations);
                    chartInstances.rco2 = createChart(document.getElementById('rco2Chart').getContext('2d'), data.timestamps, data.rco2, 'RCO2', rco2Annotations);
                    chartInstances.atmp = createChart(document.getElementById('atmpChart').getContext('2d'), data.timestamps, data.atmp, 'ATMP', []);
                    chartInstances.rhum = createChart(document.getElementById('rhumChart').getContext('2d'), data.timestamps, data.rhum, 'RHUM', rhumAnnotations);
                });
            }

            document.getElementById('timespan').addEventListener('change', function() {
                loadData(parseInt(this.value));
            });

            loadData(24);
        </script>
    </body>
</html>
